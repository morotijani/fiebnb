<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse stays — Fiebnb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .browse-head{ padding:36px 0 24px; border-bottom:1px solid var(--line); }
  .browse-bar{
    display:flex; align-items:center; gap:10px; background:var(--white); border:1px solid var(--line);
    border-radius:var(--r-pill); padding:8px; box-shadow:var(--shadow-card); max-width:760px;
  }
  .browse-bar input{ border:none; outline:none; background:transparent; padding:8px 14px; font-size:14.5px; flex:1; }
  .browse-bar .div{ width:1px; height:22px; background:var(--line); }
  .browse-bar select{ border:none; background:transparent; outline:none; font-size:14px; padding:8px 10px; color:var(--ink-soft); }

  .browse-layout{ display:grid; grid-template-columns:260px 1fr; gap:36px; padding:36px 0 100px; align-items:flex-start; }
  .filters{ position:sticky; top:88px; background:var(--white); border:1px solid var(--line); border-radius:var(--r-lg); padding:24px; }
  .filters h3{ font-size:15px; margin-bottom:2px; }
  .filter-group{ padding:18px 0; border-bottom:1px solid var(--line); }
  .filter-group:last-child{ border-bottom:none; padding-bottom:0; }
  .filter-group .fg-title{ font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin-bottom:12px; }
  .chk-row{ display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:14.5px; cursor:pointer; }
  .chk-row span.count{ color:var(--ink-soft); font-size:12.5px; }
  .chk-row input{ width:16px;height:16px; accent-color:var(--brick); margin-right:10px; }
  .chk-label{ display:flex; align-items:center; }
  .price-inputs{ display:flex; align-items:center; gap:8px; }
  .price-inputs input{ width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px; }
  .term-toggle{ display:flex; background:var(--sand); border-radius:var(--r-pill); padding:4px; }
  .term-toggle button{ flex:1; border:none; background:transparent; padding:8px 10px; border-radius:var(--r-pill); font-size:13px; font-weight:600; color:var(--ink-soft); }
  .term-toggle button.active{ background:var(--ink); color:var(--paper); }

  .results-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
  .results-head h1{ font-size:26px; }
  .results-count{ color:var(--ink-soft); font-size:14px; }
  .sort-select{ border:1px solid var(--line); border-radius:var(--r-pill); padding:9px 16px; font-size:13.5px; background:var(--white); }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px 20px; }

  @media (max-width: 980px){
    .browse-layout{ grid-template-columns:1fr; }
    .filters{ position:static; }
    .grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width: 620px){
    .grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-row">
    <a href="index.html" class="logo">
      <span class="mark"><span class="weave-strip"><span></span><span></span><span></span><span></span></span></span>
      Fiebnb
    </a>
    <div class="nav-links">
      <a href="browse.html" class="active">Stays</a>
      <a href="browse.html?type=Hotel">Hotels</a>
      <a href="browse.html?term=long">Long-term rentals</a>
      <a href="host-dashboard.html">Become a host</a>
    </div>
    <div class="nav-actions">
      <a href="host-dashboard.html" class="btn btn-ghost btn-sm">List your property</a>
      <button class="icon-btn" aria-label="Account"><i data-lucide="user" style="width:17px;height:17px"></i></button>
    </div>
  </div>
</nav>

<header class="browse-head">
  <div class="wrap">
    <div class="browse-bar">
      <input id="q-loc" type="text" placeholder="Search by city or area — e.g. Osu, Kumasi">
      <div class="div"></div>
      <select id="q-guests">
        <option>1 guest</option>
        <option selected>2 guests</option>
        <option>3 guests</option>
        <option>4+ guests</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="applyFilters()"><i data-lucide="search" style="width:15px;height:15px"></i> Search</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="browse-layout">
    <aside class="filters">
      <h3>Filters</h3>
      <div class="filter-group">
        <div class="fg-title">Stay length</div>
        <div class="term-toggle" id="term-toggle">
          <button class="active" data-term="all">Any</button>
          <button data-term="short">Short stay</button>
          <button data-term="long">Long-term</button>
        </div>
      </div>
      <div class="filter-group">
        <div class="fg-title">Property type</div>
        <label class="chk-row"><span class="chk-label"><input type="checkbox" class="f-type" value="Hotel"> Hotel</span></label>
        <label class="chk-row"><span class="chk-label"><input type="checkbox" class="f-type" value="Guesthouse"> Guesthouse</span></label>
        <label class="chk-row"><span class="chk-label"><input type="checkbox" class="f-type" value="Apartment"> Apartment</span></label>
        <label class="chk-row"><span class="chk-label"><input type="checkbox" class="f-type" value="House"> House</span></label>
      </div>
      <div class="filter-group">
        <div class="fg-title">Price range (₵)</div>
        <div class="price-inputs">
          <input id="f-min" type="number" placeholder="Min">
          <span>–</span>
          <input id="f-max" type="number" placeholder="Max">
        </div>
      </div>
      <div class="filter-group">
        <div class="fg-title">City</div>
        <select id="f-city" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;">
          <option value="">All cities</option>
          <option>Accra</option>
          <option>Kumasi</option>
          <option>Takoradi</option>
          <option>Cape Coast</option>
          <option>Elmina</option>
          <option>Tamale</option>
        </select>
      </div>
      <button class="btn btn-dark btn-block" style="margin-top:16px" onclick="applyFilters()">Apply filters</button>
      <button class="btn btn-ghost btn-block" style="margin-top:6px" onclick="resetFilters()">Clear all</button>
    </aside>

    <section>
      <div class="results-head">
        <div>
          <h1>Stays across Ghana</h1>
          <p class="results-count" id="results-count"></p>
        </div>
        <select class="sort-select" id="sort-select" onchange="applyFilters()">
          <option value="rec">Recommended</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="rating">Top rated</option>
        </select>
      </div>
      <div class="grid" id="results-grid"></div>
    </section>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <span>© 2026 Fiebnb Ghana. All rights reserved.</span>
      <span>Accra · Kumasi · Takoradi · Cape Coast · Tamale</span>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
<script>
  let currentTerm = "all";

  function paramsFromUrl(){
    const p = new URLSearchParams(window.location.search);
    return { type: p.get("type"), term: p.get("term") };
  }

  function applyFilters(){
    let list = FIEBNB_LISTINGS.slice();

    const loc = document.getElementById("q-loc").value.trim().toLowerCase();
    if(loc){
      list = list.filter(l => (l.city + " " + l.area).toLowerCase().includes(loc));
    }
    const city = document.getElementById("f-city").value;
    if(city) list = list.filter(l => l.city === city);

    if(currentTerm !== "all") list = list.filter(l => l.term === currentTerm);

    const types = Array.from(document.querySelectorAll(".f-type:checked")).map(c => c.value);
    if(types.length) list = list.filter(l => types.includes(l.type));

    const min = parseFloat(document.getElementById("f-min").value);
    const max = parseFloat(document.getElementById("f-max").value);
    if(!isNaN(min)) list = list.filter(l => l.price >= min);
    if(!isNaN(max)) list = list.filter(l => l.price <= max);

    const sort = document.getElementById("sort-select").value;
    if(sort === "price-asc") list.sort((a,b)=>a.price-b.price);
    if(sort === "price-desc") list.sort((a,b)=>b.price-a.price);
    if(sort === "rating") list.sort((a,b)=>b.rating-a.rating);

    document.getElementById("results-count").textContent = `${list.length} stay${list.length===1?"":"s"} found`;
    renderGrid("results-grid", list);
  }

  function resetFilters(){
    document.getElementById("q-loc").value = "";
    document.getElementById("f-city").value = "";
    document.getElementById("f-min").value = "";
    document.getElementById("f-max").value = "";
    document.querySelectorAll(".f-type").forEach(c => c.checked = false);
    document.getElementById("sort-select").value = "rec";
    currentTerm = "all";
    document.querySelectorAll("#term-toggle button").forEach(b => b.classList.toggle("active", b.dataset.term === "all"));
    applyFilters();
  }

  document.querySelectorAll("#term-toggle button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      currentTerm = btn.dataset.term;
      document.querySelectorAll("#term-toggle button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      applyFilters();
    });
  });

  document.addEventListener("DOMContentLoaded", ()=>{
    const {type, term} = paramsFromUrl();
    if(type){
      const box = document.querySelector(`.f-type[value="${type}"]`);
      if(box) box.checked = true;
    }
    if(term){
      currentTerm = term;
      document.querySelectorAll("#term-toggle button").forEach(b => b.classList.toggle("active", b.dataset.term === term));
    }
    applyFilters();
  });
</script>
</body>
</html>
